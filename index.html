<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Study Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunken:#eef0f4;
  --ink:#141922; --ink2:#4b5566; --ink3:#778195;
  --line:#e2e5eb; --line2:#cfd4dd;
  --accent:#2a55c8; --on-accent:#ffffff; --tint:#e9eefb;
  --ok:#17803d; --warn:#a85d00; --bad:#c0263a;
  --okbg:#e6f4ea; --warnbg:#fcf0dc; --badbg:#fbe8eb;
  --rail:232px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1218; --surface:#151b24; --sunken:#1b2330;
    --ink:#e8ebf1; --ink2:#a6b0c0; --ink3:#7b8698;
    --line:#242c39; --line2:#323d4f;
    --accent:#86a3f5; --on-accent:#0e1218; --tint:#1a2440;
    --ok:#4cc27c; --warn:#e8a94a; --bad:#f2808f;
    --okbg:#14291d; --warnbg:#2c2213; --badbg:#2e161b;
  }
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  font-variant-numeric:tabular-nums;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.code{font-weight:600}

/* header */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;max-width:1680px;margin:0 auto}
.ttl{font-weight:600;font-size:1rem;line-height:1.25}
.sub{color:var(--ink3);font-size:.8rem;line-height:1.4}
.hr{display:flex;align-items:center;gap:16px}
.wk{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--ink2);white-space:nowrap}
.wk .bar{width:96px}
#wkTxt{display:inline-flex;align-items:center;gap:6px}

/* progress bar */
.bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;width:var(--p,0%);background:var(--accent);border-radius:3px;transition:width .3s ease}

/* navigation: bottom bar on phones, side rail on desktop */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .brand{display:none}
.nav ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(7,1fr)}
.nav button{width:100%;background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:.66rem;line-height:1.2;position:relative}
.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent);font-weight:600}
.badge{position:absolute;top:3px;inset-inline-start:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:.64rem;font-weight:600;display:grid;place-items:center}
.badge.info{background:var(--accent);color:var(--on-accent)}

/* page */
.page{max-width:1680px;margin:0 auto;padding:22px 20px 40px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.ph h1{font-size:1.8rem;line-height:1.15;font-weight:600;letter-spacing:-.015em}
.ph .sub{color:var(--ink2);font-size:.92rem;margin-top:4px}
h2{font-size:.95rem;font-weight:600;margin:0 0 10px}
.sec+.sec{margin-top:26px}
.cols{display:grid;gap:26px;align-items:start}
.cols>*{min-width:0}
.credit{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink3);font-size:.82rem}
.credit b{color:var(--ink2);font-weight:600}
.notice{margin-bottom:16px;padding:10px 14px;border:1px solid var(--bad);border-radius:8px;background:var(--badbg);color:var(--bad);font-size:.9rem}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.empty{padding:22px 16px;text-align:center;color:var(--ink3)}

/* buttons */
.btn{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:.42rem .95rem;font-weight:500;font-size:.88rem;line-height:1.4;color:var(--ink);transition:background .12s}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:.2rem .7rem;font-size:.82rem}
.btn.quiet{border-color:transparent;background:none;color:var(--ink2)}
.btn.quiet:hover{background:var(--sunken)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:.84rem;font-weight:500;margin-top:8px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:6px 14px;font-size:.86rem;font-weight:500;color:var(--ink2)}
.seg button+button{border-inline-start:1px solid var(--line2)}
.seg button:hover{background:var(--sunken)}

/* today */
.daybar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:-4px 0 20px}
.daybar .bar{width:min(320px,100%);flex:none}
.daybar .cnt{font-size:.86rem;color:var(--ink2)}
.trendbtn{background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:8px;font-size:.84rem;color:var(--ink2)}
.alerts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.alert{display:inline-flex;align-items:center;gap:8px;text-align:start;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:.4rem .8rem;font-size:.88rem;font-weight:500}
.alert::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.alert.info::before{background:var(--accent)}
.alert.bad::before{background:var(--bad)}
.alert:hover{background:var(--sunken)}
.slot{display:grid;grid-template-columns:88px 1fr;gap:0 4px;padding:14px 16px;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.gut{font-size:.8rem;color:var(--ink3);line-height:1.45}
.gut b{display:block;font-size:.95rem;color:var(--ink);font-weight:600;white-space:nowrap}
.sbody{border-inline-start:3px solid var(--c);padding-inline-start:14px;min-width:0}
.sbody h3{font-size:1rem;font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;line-height:1.45}
.sbody h3 .nm{font-weight:500;color:var(--ink2)}
.tag{display:inline-flex;align-items:center;border-radius:4px;padding:0 7px;font-size:.74rem;font-weight:500;line-height:1.6;background:var(--sunken);color:var(--ink2)}
.tag.now{background:var(--accent);color:var(--on-accent)}
.tag.next{background:var(--tint);color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:0 14px;margin-top:2px;font-size:.85rem;color:var(--ink2)}
.meta span+span{color:var(--ink3)}
.steps{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px}

/* checkbox */
.chk{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:.88rem}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .box{flex:none;width:18px;height:18px;border:1.5px solid var(--line2);border-radius:5px;background:var(--surface);display:grid;place-items:center;transition:background .12s,border-color .12s}
.chk:hover .box{border-color:var(--ink3)}
.chk input:checked+.box{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.chk input:checked+.box::after{content:'';width:4.5px;height:9px;border:solid var(--tick,#fff);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:checked~.lbl{color:var(--ink3);text-decoration:line-through;text-decoration-thickness:1px}
.chk input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.list .chk{--tick:var(--on-accent);display:flex;padding:12px 16px;border-top:1px solid var(--line);width:100%}
.list .chk:first-child{border-top:0}

/* week */
.weekgrid{display:grid;gap:12px;grid-template-columns:1fr}
.wd{padding:14px 16px;display:flex;flex-direction:column}
.wd.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wd header{display:flex;align-items:center;gap:10px;justify-content:space-between}
.wd h3{font-size:1rem;font-weight:600}
.wd h3 small{color:var(--ink3);font-weight:400;font-size:.8rem;margin-inline-start:8px}
.wd ul{list-style:none;padding:0;margin:10px 0 12px;display:grid;gap:6px;font-size:.86rem;flex:1}
.wd li{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;padding-inline-start:10px;border-inline-start:3px solid var(--c)}
.wd li .tm{color:var(--ink3);min-width:74px}
.wd li .ty{color:var(--ink2)}
.wd li.none{border-inline-start-color:var(--line);color:var(--ink3)}
.wd .btn{align-self:flex-start}
.frac{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink3)}

/* forms */
.form{padding:18px;display:grid;gap:14px}
.form h3{font-size:1rem;font-weight:600}
.form label{display:grid;gap:5px;font-size:.84rem;color:var(--ink2);font-weight:500}
.form input,.form select,.form textarea,textarea.notes{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:.5rem .7rem;font-size:.92rem;color:var(--ink)}
.form input:focus,.form select:focus,.form textarea:focus,textarea.notes:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:.84rem;color:var(--ink3)}
textarea.notes{min-height:76px;resize:vertical}
.tools{display:flex;flex-wrap:wrap;gap:8px}

/* tasks + reviews */
.rows{list-style:none;padding:0}
.rows>li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px 16px;border-top:1px solid var(--line)}
.rows>li:first-child{border-top:0}
.rows b{font-weight:600}
.tick{width:22px;height:22px;border:1.5px solid var(--line2);border-radius:6px;background:var(--surface);margin-top:1px;display:grid;place-items:center;padding:0}
.tick:hover{border-color:var(--ink3)}
.done .tick{background:var(--ok);border-color:var(--ok)}
.done .tick::after{content:'';width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done b{color:var(--ink3);text-decoration:line-through;font-weight:500}
.cd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-inline-end:6px}
.tk-meta{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;font-size:.84rem;color:var(--ink2);margin-top:2px}
.st{font-size:.86rem;font-weight:500;margin-top:3px}
.st.bad{color:var(--bad)} .st.warn{color:var(--warn)} .st.ok{color:var(--ok)}
.rows.rvl>li{grid-template-columns:1fr}
.rv-main{display:grid;gap:1px}
.rv-main small{color:var(--ink2);font-size:.84rem}
.rv-act{display:flex;flex-wrap:wrap;gap:6px}

/* subjects */
.gridcards{display:grid;gap:14px;grid-template-columns:1fr}
.sub-card{padding:16px 18px;border-top:3px solid var(--c);display:grid;gap:10px;align-content:start}
.sub-card h3{font-size:1rem;font-weight:600;line-height:1.35}
.sub-card h3 .code{display:block;color:var(--ink2);font-size:.82rem;margin-bottom:1px}
.sub-card ul{list-style:none;padding:0;display:grid;gap:4px;font-size:.87rem}
.sub-card li{display:flex;flex-wrap:wrap;gap:0 8px}
.sub-card li small{color:var(--ink3);font-size:.84rem}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:0 10px;font-size:.78rem;font-weight:500;color:var(--ink2);background:var(--sunken);line-height:1.7}
.pill.bad{color:var(--bad);background:var(--badbg)}

/* indicators */
.trend{display:inline-flex;align-items:center;gap:5px;padding:1px 10px 1px 8px;border-radius:999px;font-size:.78rem;font-weight:500;line-height:1.6;white-space:nowrap}
.trend svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.trend.ok{color:var(--ok);background:var(--okbg)}
.trend.warn{color:var(--warn);background:var(--warnbg)}
.trend.bad{color:var(--bad);background:var(--badbg)}
.trend.neu{color:var(--ink2);background:var(--sunken)}
.trend.mini{padding:1px 4px;border-radius:5px}
.pace{padding:18px 20px;display:grid;gap:8px}
.pace .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pace .big{font-size:2.8rem;font-weight:600;line-height:1;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:grid;gap:6px;align-content:start;justify-items:start}
.stat .k{color:var(--ink2);font-size:.84rem;font-weight:500}
.stat .v{font-size:1.6rem;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.stat .v small{font-size:.5em;color:var(--ink3);font-weight:400;margin-inline-start:.4em;letter-spacing:0}
.stat p{font-size:.78rem;color:var(--ink3);line-height:1.45}
.chart{display:grid;gap:6px;padding:16px 12px 12px}
.chart.c7{grid-template-columns:repeat(7,1fr)}
.chart.c4{grid-template-columns:repeat(4,1fr)}
.col{display:grid;justify-items:center;align-content:end;gap:4px;font-size:.68rem;color:var(--ink3);text-align:center;line-height:1.3;min-width:0}
.col .pc{font-weight:600;color:var(--ink);font-size:.78rem;min-height:1.2em}
.col .track{height:96px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.col .b{display:block;width:70%;max-width:34px;height:var(--h,4px);min-height:4px;background:var(--bc,var(--line2));border-radius:4px 4px 0 0}
.col .dl{display:inline-flex;align-items:center;gap:3px;min-height:22px;font-size:.72rem}
.col.today .lab{color:var(--ink);font-weight:600}
.col.today .b{outline:2px solid var(--ink);outline-offset:1px}
.crs{list-style:none;padding:0}
.crs li{display:grid;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
.crs li:first-child{border-top:0}
.crs .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crs .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}

/* poll */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:start;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:14px 16px;font-weight:500}
.opt:hover{background:var(--sunken)}
.rd{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--tint)}
.opt[aria-checked="true"] .rd{border-color:var(--accent)}
.opt[aria-checked="true"] .rd::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent)}
.q2{display:grid;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grp{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:9px 0;font-weight:500;text-align:center}
.grp:hover{background:var(--sunken)}
.grp[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunken)}
.split i{display:block;height:100%}
.legend2{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--ink2)}
.legend2 b{color:var(--ink);font-weight:600}
.legend2 i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px}
.res{display:grid;grid-template-columns:64px 1fr 34px;gap:10px;align-items:center;font-size:.88rem;color:var(--ink2)}
.res .n{text-align:end;color:var(--ink);font-weight:600}
.res.mine .lb{color:var(--ink);font-weight:600}
.res.mine .bar i{background:var(--accent)}
.res .bar i{background:var(--line2)}
.res .bar{height:8px}
.done-note{display:grid;gap:4px}
.done-note h3{display:flex;align-items:center;gap:8px}
.done-note h3::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--ok)}

/* account + sign-in gate */
.acct{position:relative;width:36px;height:36px;padding:0;border:1px solid var(--line2);border-radius:50%;background:var(--surface);flex:none}
.lang{height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);color:var(--ink2);font-size:.82rem;font-weight:600;flex:none;white-space:nowrap}
.lang:hover{background:var(--sunken)}
html[dir=rtl] body{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html[dir=rtl] .gut b,html[dir=rtl] .wd li .tm{direction:ltr;text-align:start;unicode-bidi:isolate}
.av{width:100%;height:100%;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center;font-weight:600;position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dot{position:absolute;bottom:-2px;inset-inline-end:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--surface);background:var(--ink3)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;overflow:auto;background:var(--bg)}
.sheet{width:100%;max-width:400px;margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 26px 26px}
.sheet .h{font-size:1.25rem;font-weight:600;letter-spacing:-.01em}
.sheet .p{color:var(--ink2);font-size:.9rem;margin:4px 0 18px}
.g-av{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;overflow:hidden}
.g-av .av{font-size:1.4rem}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:4px}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 8px;font-weight:600;color:var(--ink3)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.fld{display:block;width:100%;height:44px;margin-top:12px;padding:0 14px;background:var(--surface);border:1px solid var(--line2);border-radius:8px;color:var(--ink);font-size:.95rem}
.fld::placeholder{color:var(--ink3)}
.fld:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.flink{background:none;border:0;padding:0;margin-top:12px;color:var(--accent);font-size:.88rem}
.msg{font-size:.88rem;line-height:1.5;margin-top:12px}
.msg:empty{display:none}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}
.msg .code2{color:var(--ink3);font-size:.85em}
.gbtn{display:block;width:100%;height:44px;margin-top:16px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:600}
.gbtn:hover{filter:brightness(1.08)}
.gbtn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.gbtn.alt{background:var(--surface);color:var(--ink);border-color:var(--line2);margin-top:10px;font-weight:500}
.gbtn.alt:hover{background:var(--sunken);filter:none}
.dv{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:.85rem;margin:20px 0 14px}
.dv::before,.dv::after{content:'';flex:1;height:1px;background:var(--line)}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:8px;background:var(--surface);border:1px solid var(--line2);font-weight:500;font-size:.9rem}
.pbtn:hover{background:var(--sunken)}
.pbtn svg{width:18px;height:18px}
.pbtn:disabled{opacity:.5;cursor:not-allowed}
.devnote{border:1px dashed var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.84rem;line-height:1.5;margin-top:12px}
.acc-nm{text-align:center;font-weight:600;font-size:1.1rem}
.acc-em{text-align:center;color:var(--ink2);font-size:.9rem;margin-top:2px}
.stat-line{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.86rem;color:var(--ink2);margin-top:12px}
.stat-line .dot{position:static;border:0;width:9px;height:9px;flex:none}

#toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;max-width:420px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:8px;padding:.6rem .9rem;text-align:center;font-size:.9rem;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}

@media (max-width:420px){.ph h1{font-size:1.6rem}.slot{grid-template-columns:78px 1fr;padding-inline:12px}.two{grid-template-columns:1fr}.wk .bar{display:none}}
@media (min-width:640px){
  .weekgrid{grid-template-columns:repeat(2,1fr)}
  .gridcards{grid-template-columns:repeat(2,1fr)}
  .groups{grid-template-columns:repeat(8,1fr)}
}
@media (min-width:900px){
  body{padding-inline-start:var(--rail);padding-bottom:0}
  .topin{padding:12px 40px}
  .top .ttl{display:none}
  .top .sub{font-size:.86rem}
  .page{padding:30px 40px 56px}
  .nav{inset-inline-start:0;inset-inline-end:auto;top:0;bottom:0;width:var(--rail);border-top:0;border-inline-end:1px solid var(--line);padding:24px 12px}
  .nav .brand{display:block;padding:2px 12px 22px;font-weight:600;font-size:1.05rem;line-height:1.25}
  .nav .brand small{display:block;color:var(--ink3);font-weight:400;font-size:.76rem;margin-top:2px}
  .nav ul{display:flex;flex-direction:column;gap:2px}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:9px 12px;border-radius:8px;font-size:.9rem;font-weight:500;color:var(--ink2)}

  .nav button.on{background:var(--tint);color:var(--accent)}
  .badge{position:static;margin-inline-start:auto}
  #toast{bottom:24px}
  .gridcards{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:1100px){
  .cols.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}

      rules_version = '2';

          // NOTE ON PRIVACY: because each vote document is named after the voter's

          match /support_votes/{uid} {
            allow read: if request.auth != null;

const REVS=()=>S.reviews.filter(r=>!r.del);
const activeRev=()=>REVS().filter(r=>!r.done);
const dueRev=()=>activeRev().filter(r=>diffDays(parse(r.due),today0())<=0);
function taskInfo(t){
  const T=today0(),dl=parse(t.deadline),left=diffDays(dl,T),start=addDays(dl,-t.lead),startIn=diffDays(start,T);
  let cls,txt;
  if(left<0){cls='bad';txt=L('overdueBy',pl(-left,'day'));}
  else if(startIn<=0){cls=left<=2?'bad':'warn';txt=left===0?L('dueToday'):L('timeToStart',pl(left,'day'));}
  else{cls='ok';txt=L('startsIn',pl(startIn,'day'),fmtDate(start));}
  return {left,cls,txt};
}
const urgentTasks=()=>TASKS().filter(t=>!t.done&&taskInfo(t).cls!=='ok');
const pollOpen=()=>!!cloud.user&&poll.status==='ready'&&!poll.mine;
const subjOpts=()=>Object.keys(SUBJ).map(c=>'<option value="'+c+'">'+c+' '+esc(loc(SUBJ[c].short))+'</option>').join('');
function chk(key,label,cls){
  return '<label class="chk '+(cls||'')+'"><input type="checkbox" data-k="'+key+'" '+(S.checks[key]?'checked':'')+'><span class="box"></span><span class="lbl">'+esc(label)+'</span></label>';
}

/* ---------- views ---------- */
function viewToday(){
  const d=viewDate,dow=d.getDay(),k=iso(d),isToday=k===iso(today0());
  const ss=sessOf(dow),st=dayStats(d),pct=st.total?Math.round(st.done/st.total*100):0;
  const n=new Date(),nowM=n.getHours()*60+n.getMinutes();let nextFound=false;
  const rows=ss.map(s=>{
    const sub=SUBJ[s.sub],a=s.start.split(':').map(Number),b=s.end.split(':').map(Number);
    let tag='';
    if(isToday){
      if(nowM>=a[0]*60+a[1]&&nowM<b[0]*60+b[1])tag='<span class="tag now">'+L('now')+'</span>';
      else if(nowM<a[0]*60+a[1]&&!nextFound){tag='<span class="tag next">'+L('next')+'</span>';nextFound=true;}
    }
    const labels=RAW('steps')[s.type].slice();if(s.mode==='online')labels[1]=L('joined');
    const steps=labels.map((l,i)=>chk(k+'|s|'+s.id+'|'+i,l)).join('');
    const where=s.mode==='online'?L('online'):esc(loc(s.place));
    return '<div class="slot" style="--c:'+sub.color+'">'+
      '<div class="gut"><b>'+t12(s.start)+'</b>'+t12(s.end)+'</div>'+
      '<div class="sbody"><h3><span class="code">'+s.sub+'</span><span class="nm">'+esc(loc(sub.short))+'</span><span class="tag">'+L(s.type)+'</span>'+tag+'</h3>'+
      '<div class="meta"><span>'+where+'</span><span>'+esc(loc(s.who))+'</span></div>'+
      '<div class="steps">'+steps+'</div>'+
      '<button class="link" data-act="addrev" data-sub="'+s.sub+'">'+L('addTopic')+'</button></div></div>';
  }).join('');
  const blocks=blockList(dow).map((b,i)=>chk(k+'|b|'+i,b)).join('');
  const dr=dueRev().length,ut=urgentTasks().length;
  let al='';
  if(dr)al+='<button class="alert" data-act="tab" data-v="review">'+L('revDue',pl(dr,'review'))+'</button>';
  if(ut)al+='<button class="alert bad" data-act="tab" data-v="tasks">'+L('tasksDue',pl(ut,'task'))+'</button>';
  if(pollOpen())al+='<button class="alert info" data-act="tab" data-v="poll">'+L('pollOpen')+'</button>';
  return '<div class="ph"><div><h1>'+dayName(dow)+'</h1><p class="sub">'+fmtLong(d)+'. '+esc(dayLine(dow))+'</p></div>'+
    '<div class="seg" role="group" aria-label="'+L('changeDay')+'"><button data-act="prev">'+L('prev')+'</button><button data-act="now">'+L('todayBtn')+'</button><button data-act="next">'+L('nextBtn')+'</button></div></div>'+
    '<div class="daybar"><div class="bar"><i style="--p:'+pct+'%"></i></div><span class="cnt">'+L('doneOf',st.done,st.total)+'</span>'+
    (isToday?'<button class="trendbtn" data-act="tab" data-v="progress">'+chip(paceStatus(calcWeek(weekStart()).pace))+'<span>'+L('weeklyPace')+'</span></button>':'')+'</div>'+
    (isToday&&al?'<div class="alerts">'+al+'</div>':'')+
    '<div class="cols two"><section class="sec">'+H2(L('sessions'))+
    (ss.length?'<div class="panel">'+rows+'</div>':'<div class="panel empty">'+esc(loc(NO_CLASS[dow])||L('noSessionsToday'))+'</div>')+'</section>'+
    '<section class="sec">'+H2(L('studyPlan'))+'<div class="panel list">'+blocks+'</div></section></div>';
}

function viewWeek(){
  const ws=weekStart();let T=0,D=0;
  const cards=ORDER.map((dow,i)=>{
    const d=addDays(ws,i),st=dayStats(d);T+=st.total;D+=st.done;
    const isT=iso(d)===iso(today0());
    const list=sessOf(dow).map(s=>'<li style="--c:'+SUBJ[s.sub].color+'"><span class="tm">'+t12(s.start)+'</span><b class="code">'+s.sub+'</b><span class="ty">'+L(s.type)+(s.mode==='online'?'، '+L('online'):'')+'</span></li>').join('')||'<li class="none">'+L('noSessions')+'</li>';
    return '<article class="panel wd'+(isT?' is-today':'')+'"><header><h3>'+dayName(dow)+'<small>'+fmtDate(d)+'</small></h3><span class="frac">'+dayArrow(d,st)+st.done+' / '+st.total+'</span></header>'+
      '<ul>'+list+'</ul><button class="btn sm" data-act="go" data-d="'+iso(d)+'">'+L('openDay')+'</button></article>';
  }).join('');
  const p=T?Math.round(D/T*100):0;
  return '<div class="ph"><div><h1>'+L('tab_week')+'</h1><p class="sub">'+L('weekRange',fmtDate(ws),fmtDate(addDays(ws,6)),p)+'</p></div></div>'+
    '<div class="daybar"><div class="bar"><i style="--p:'+p+'%"></i></div></div>'+
    '<div class="weekgrid">'+cards+'</div>';
}

/* ---------- progress and indicators ---------- */
const ARROW={
  up:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  flat:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};
const NEU=()=>({cls:'neu',arrow:'flat',label:L('noData')});
function chip(st,mini){
  if(mini)return '<span class="trend mini '+st.cls+'" title="'+esc(st.label)+'" aria-label="'+esc(st.label)+'">'+ARROW[st.arrow]+'</span>';
  return '<span class="trend '+st.cls+'">'+ARROW[st.arrow]+'<span>'+esc(st.label)+'</span></span>';
}
function paceStatus(r){
  if(r===null)return {cls:'neu',arrow:'flat',label:L('justStarted')};
  if(r>1.02)return {cls:'ok',arrow:'up',label:L('ahead')};
  if(r>=0.85)return {cls:'ok',arrow:'flat',label:L('onTrack')};
  if(r>=0.6)return {cls:'warn',arrow:'down',label:L('slightlyBehind')};
  return {cls:'bad',arrow:'down',label:L('behind')};
}
function pctStatus(p){
  if(p===null)return NEU();
  if(p>=85)return {cls:'ok',arrow:'up',label:L('good')};
  if(p>=60)return {cls:'warn',arrow:'flat',label:L('fair')};
  return {cls:'bad',arrow:'down',label:L('low')};
}
function deltaStatus(dl){
  if(dl>=5)return {cls:'ok',arrow:'up',label:L('improving')};
  if(dl<=-5)return {cls:'bad',arrow:'down',label:L('declining')};
  return {cls:'neu',arrow:'flat',label:L('stable')};
}
const sinceDate=()=>parse(S.since);
function itemsOfDay(d){
  const k=iso(d),out=[];
  sessOf(d.getDay()).forEach(s=>{for(let i=0;i<3;i++)out.push({key:k+'|s|'+s.id+'|'+i,sub:s.sub,step:i,start:s.start});});
  blockList(d.getDay()).forEach((b,i)=>out.push({key:k+'|b|'+i,step:-1}));
  return out;
}
function expectedNow(it,d){
  const c=diffDays(d,today0());
  if(c<0)return true;
  if(c>0)return false;
  if(it.step===0||it.step===1){
    const n=new Date(),m=n.getHours()*60+n.getMinutes(),p=it.start.split(':').map(Number);
    return m>=p[0]*60+p[1];
  }
  return false;
}
function calcWeek(ws){
  const since=sinceDate();
  let E=0,Dall=0,tot=0,doneAll=0;
  const days=[],bySub={},att={E:0,D:0};
  for(let i=0;i<7;i++){
    const d=addDays(ws,i),c=diffDays(d,today0()),active=diffDays(d,since)>=0;
    let dt=0,dd=0;
    if(active){
      itemsOfDay(d).forEach(it=>{
        const done=!!S.checks[it.key],exp=expectedNow(it,d);
        dt++;if(done)dd++;
        if(exp)E++;
        if(c<=0&&done)Dall++;
        if(it.sub){
          const b=bySub[it.sub]||(bySub[it.sub]={E:0,D:0});
          if(exp)b.E++;
          if(c<=0&&done)b.D++;
          if(it.step===1&&exp){att.E++;if(done)att.D++;}
        }
      });
    }
    tot+=dt;doneAll+=dd;
    days.push({d,c,active,total:dt,done:dd,pct:dt?Math.round(dd/dt*100):null});
  }
  return {E,Dall,tot,doneAll,days,bySub,att,pace:E?Dall/E:null,pct:tot?Math.round(doneAll/tot*100):null};
}
function streakDays(){
  const T=today0(),since=sinceDate();let n=0;
  for(let i=0;i<120;i++){
    const d=addDays(T,-i);
    if(diffDays(d,since)<0)break;
    const st=dayStats(d),ok=st.total&&st.done/st.total>=0.7;
    if(ok)n++;else if(i===0)continue;else break;
  }
  return n;
}
function dayArrow(d,st){
  if(diffDays(d,today0())>=0||diffDays(d,sinceDate())<0||!st.total)return '';
  return chip(pctStatus(Math.round(st.done/st.total*100)),true);
}

function viewProgress(){
  const T=today0(),ws=weekStart(),m=calcWeek(ws),prev=calcWeek(addDays(ws,-7));
  const ps=paceStatus(m.pace),curPct=m.pace===null?null:Math.min(100,Math.round(m.pace*100));
  const revs=activeRev(),openT=TASKS().filter(t=>!t.done);
  const sign=n=>(n>0?'+':'')+n;
  let vs='';
  if(curPct!==null&&prev.pct!==null){
    const dl=curPct-prev.pct;
    vs='<div class="row">'+chip(deltaStatus(dl))+'<span class="hint">'+L('vsLastWeek',prev.pct,sign(dl))+'</span></div>';
  }
  const pace='<section class="panel pace"><div class="hint">'+L('weeklyPace')+'</div>'+
    '<div class="row"><span class="big">'+(curPct===null?'&mdash;':curPct+'%')+'</span>'+chip(ps)+'</div>'+
    '<div class="hint">'+(m.E?L('doneItems',m.Dall,m.E):L('noItemsYet'))+'</div>'+vs+'</section>';

  const attP=m.att.E?Math.round(m.att.D/m.att.E*100):null;
  const overdueR=revs.filter(r=>diffDays(parse(r.due),T)<0).length,dueR=revs.filter(r=>diffDays(parse(r.due),T)===0).length;
  const revSt=overdueR?{cls:'bad',arrow:'down',label:L('nOverdue',overdueR)}:dueR?{cls:'warn',arrow:'flat',label:L('dueToday')}:{cls:'ok',arrow:'up',label:L('upToDate')};
  const overdueT=openT.filter(t=>taskInfo(t).left<0).length,startT=openT.filter(t=>{const i=taskInfo(t);return i.left>=0&&i.cls!=='ok';}).length;
  const tkSt=overdueT?{cls:'bad',arrow:'down',label:L('nOverdue',overdueT)}:startT?{cls:'warn',arrow:'flat',label:L('nToStart',startT)}:{cls:'ok',arrow:'up',label:L('onSchedule')};
  const sd=streakDays(),hasData=Object.keys(S.checks).length>0;
  const stSt=!hasData?NEU():sd>=3?{cls:'ok',arrow:'up',label:L('strong')}:sd>=1?{cls:'warn',arrow:'flat',label:L('short')}:{cls:'bad',arrow:'down',label:L('broken')};
  const tile=(k,v,unit,sub,st)=>'<div class="stat"><div class="k">'+k+'</div><div class="v">'+v+(unit?'<small>'+unit+'</small>':'')+'</div>'+chip(st)+(sub?'<p>'+sub+'</p>':'')+'</div>';
  const tiles='<div class="stats">'+
    tile(L('attendance'),attP===null?'&mdash;':attP+'%','',m.att.E?L('attendedOf',m.att.D,m.att.E):L('noSessionsWeek'),attP===null?NEU():pctStatus(attP))+
    tile(L('reviewsT'),dueR+overdueR,L('dueUnit'),L('activeTopics',revs.length),revSt)+
    tile(L('tasksT'),openT.length,L('openUnit'),'',tkSt)+
    tile(L('streak'),pl(sd,'day'),'',L('streakHint'),stSt)+'</div>';

  const dayCols=m.days.map((x,i)=>{
    const dow=ORDER[i];let h='4px',bc='var(--line2)',pc='';
    if(x.active&&x.pct!==null&&x.c<=0){h=Math.max(4,x.pct)+'%';bc=x.c===0?'var(--accent)':(x.pct>=85?'var(--ok)':x.pct>=60?'var(--warn)':'var(--bad)');pc=x.pct+'%';}
    return '<div class="col '+(x.c===0?'today':'')+'"><span class="pc">'+pc+'</span><div class="track"><i class="b" style="--h:'+h+';--bc:'+bc+'"></i></div><span class="lab">'+dayShort(dow)+'</span></div>';
  }).join('');

  const hist=[3,2,1,0].map(k=>({k,d:addDays(ws,-7*k),v:k?calcWeek(addDays(ws,-7*k)).pct:curPct}));
  const histCols=hist.map((h,i)=>{
    const pv=i?hist[i-1].v:null;let dl='';
    if(h.v!==null&&pv!==null){const x=h.v-pv;dl=chip(deltaStatus(x),true)+'<span>'+sign(x)+'</span>';}
    const bc=h.k===0?'var(--accent)':h.v===null?'var(--line2)':h.v>=85?'var(--ok)':h.v>=60?'var(--warn)':'var(--bad)';
    const lab=h.k===0?L('current'):L('weekOf',fmtDate(h.d));
    return '<div class="col '+(h.k===0?'today':'')+'"><span class="pc">'+(h.v===null?'':h.v+'%')+'</span><div class="track"><i class="b" style="--h:'+(h.v===null?'4px':Math.max(4,h.v)+'%')+';--bc:'+bc+'"></i></div><span class="lab">'+lab+'</span><span class="dl">'+dl+'</span></div>';
  }).join('');

  const crs=Object.keys(SUBJ).map(code=>{
    const sj=SUBJ[code],b=m.bySub[code]||{E:0,D:0};
    const p=b.E?Math.min(100,Math.round(b.D/b.E*100)):null,st=p===null?NEU():pctStatus(p);
    const oR=revs.filter(r=>r.sub===code&&diffDays(parse(r.due),T)<0).length,oT=openT.filter(t=>t.sub===code&&taskInfo(t).left<0).length;
    return '<li style="--c:'+sj.color+'"><div class="top2"><span><span class="code"><i class="cd"></i>'+code+'</span> '+esc(loc(sj.short))+'</span><b>'+(p===null?'&mdash;':p+'%')+'</b></div>'+
      '<div class="bar"><i style="--p:'+(p||0)+'%"></i></div>'+
      '<div class="chips">'+chip(st)+(oR?'<span class="pill bad">'+pl(oR,'overdueReview')+'</span>':'')+(oT?'<span class="pill bad">'+pl(oT,'overdueTask')+'</span>':'')+
      (b.E?'<span class="pill">'+b.D+' / '+b.E+'</span>':'')+'</div></li>';
  }).join('');

function voteDone(m){

function pollResults(mine){
  if(!mine)return '<section class="panel empty">'+L('resultsAfter')+'</section>';
  const v=poll.votes,total=v.length,yes=v.filter(x=>x.support===true),yn=yes.length,no=total-yn;
  const yp=total?Math.round(yn/total*100):0,np=total?100-yp:0;
  const per=Array(GROUPS+1).fill(0);
  yes.forEach(x=>{if(x.group>=1&&x.group<=GROUPS)per[x.group]++;});
  const max=Math.max(1,...per.slice(1));
  let rows='';
  for(let g=1;g<=GROUPS;g++){
    rows+='<div class="res'+(mine.support&&mine.group===g?' mine':'')+'"><span class="lb">'+L('group')+' '+g+'</span><div class="bar"><i style="--p:'+Math.round(per[g]/max*100)+'%"></i></div><span class="n">'+per[g]+'</span></div>';
  }
  return '<div><section class="sec">'+H2(L('results'))+'<div class="panel form">'+
    '<div class="split" role="img" aria-label="'+L('yesNoAria',yp,np)+'"><i style="width:'+yp+'%;background:var(--accent)"></i><i style="width:'+np+'%;background:var(--line2)"></i></div>'+
    '<div class="legend2"><span><i style="background:var(--accent)"></i><b>'+L('yes')+'</b> '+yp+'% ('+yn+')</span><span><i style="background:var(--line2)"></i><b>'+L('no')+'</b> '+np+'% ('+no+')</span><span>'+pl(total,'vote')+'</span></div></div></section>'+
    '<section class="sec">'+H2(L('yesByGroup'))+'<div class="panel form">'+rows+'</div></section></div>';

function viewPoll(){

    '<div class="notice" style="border-color:var(--line2);background:var(--sunken);color:var(--ink2)">'+L('pollNotAnon')+'</div>';
  if(!cloud.user)return head+'<div class="panel empty">'+L('pollSignIn')+'</div>';

async function submitVote(){
  const dr=poll.draft;
  if(poll.busy||dr.support===null||(dr.support&&!dr.group))return;
  if(!bridge.pollVote){toast(L('pollNotReady'));return;}
  const wasEdit=poll.editing;
  poll.busy=true;render();
  try{await bridge.pollVote(dr.support,dr.support?dr.group:null);poll.editing=false;toast(wasEdit?L('voteUpdated'):L('voteSubmitted'));}
  catch(e){
    console.error(e);
    toast(e&&e.code==='permission-denied'?L('voteFailRules'):L('voteFailNet'));
  }
  poll.busy=false;render();
}

/* Replacing the whole state (restoring a backup, or erasing everything)
   has to leave a tombstone for each item that disappears. Without them the
   merge with another device would simply bring the old items back. */
function replaceState(next){
  const t=now(),keep=new Set;
  (next.tasks||[]).forEach(x=>keep.add('t'+x.id));
  (next.reviews||[]).forEach(x=>keep.add('r'+x.id));
  TASKS().forEach(x=>{if(!keep.has('t'+x.id))next.tasks.push({id:x.id,sub:x.sub,title:'',type:'Other',deadline:x.deadline,lead:3,done:false,del:t,upd:t});});
  REVS().forEach(x=>{if(!keep.has('r'+x.id))next.reviews.push({id:x.id,sub:x.sub,topic:'',stage:0,due:x.due,done:false,del:t,upd:t});});
  Object.keys(S.checks||{}).forEach(k=>{if(!next.checks[k])next.xchecks[k]=t;});
  Object.keys(SUBJ).forEach(c=>{if(S.notes[c]&&next.notes[c]===undefined){next.notes[c]='';next.noteAt[c]=t;}});
  (next.tasks||[]).forEach(x=>{if(!x.upd)x.upd=t;});
  (next.reviews||[]).forEach(x=>{if(!x.upd)x.upd=t;});
  Object.keys(next.checks).forEach(k=>{if(next.checks[k]===true)next.checks[k]=t;});
  S=next;save();render();
}
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function cleanBackup(o){
  if(!o||typeof o!=='object')throw new Error('invalid');
  const r=defaults(),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),sid=v=>String(v||uid()).replace(/[^\w-]/g,'')||uid();
  const CK=/^\d{4}-\d{2}-\d{2}\|(s|b)\|/;
  if(o.checks&&typeof o.checks==='object')Object.keys(o.checks).forEach(k=>{if(o.checks[k]&&CK.test(k))r.checks[k]=tsOf(o.checks[k])||1;});
  if(o.xchecks&&typeof o.xchecks==='object')Object.keys(o.xchecks).forEach(k=>{if(o.xchecks[k]&&CK.test(k))r.xchecks[k]=tsOf(o.xchecks[k])||1;});
  r.tasks=(Array.isArray(o.tasks)?o.tasks:[]).filter(t=>t&&SUBJ[t.sub]&&typeof t.title==='string'&&DATE_RE.test(t.deadline)).map(t=>({id:sid(t.id),title:t.title,sub:t.sub,type:String(t.type||'Other'),deadline:t.deadline,lead:Math.max(1,Math.min(30,parseInt(t.lead,10)||3)),done:!!t.done,upd:tsOf(t.upd),del:tsOf(t.del)||undefined}));
  r.reviews=(Array.isArray(o.reviews)?o.reviews:[]).filter(x=>x&&SUBJ[x.sub]&&typeof x.topic==='string'&&DATE_RE.test(x.due)).map(x=>({id:sid(x.id),sub:x.sub,topic:x.topic,stage:Math.max(0,Math.min(INTERVALS.length,parseInt(x.stage,10)||0)),due:x.due,done:!!x.done,upd:tsOf(x.upd),del:tsOf(x.del)||undefined}));
  if(o.notes&&typeof o.notes==='object')Object.keys(SUBJ).forEach(c=>{if(typeof o.notes[c]==='string'){r.notes[c]=o.notes[c];r.noteAt[c]=tsOf((o.noteAt||{})[c]);}});
  if(DATE_RE.test(o.since))r.since=o.since;
  return r;
}

document.addEventListener('click',e=>{

  if(a==='authclose'){closeAuth();return;}
  if(a==='authtab'){cloud.mode=el.dataset.m;cloud.msg='';renderAuth();return;}
  if(a==='reload'){window.location.reload();return;}
  if(a==='forgot'){
    const em=(document.querySelector('#authBody input[name=email]')||{value:''}).value.trim();
    if(!em){setMsg(L('enterEmailFirst'));return;}
    if(bridge.resetPassword)bridge.resetPassword(em);
    return;
  }
  if(a==='signin'){setMsg('');if(bridge.signIn)bridge.signIn(el.dataset.p);return;}
  if(a==='signout'){if(bridge.doSignOut)bridge.doSignOut();return;}
  if(a==='syncnow'){if(bridge.syncNow)bridge.syncNow();return;}
  if(a==='tab'){setTab(el.dataset.v);return;}
  if(a==='prev'){viewDate=addDays(viewDate,-1);render();return;}
  if(a==='next'){viewDate=addDays(viewDate,1);render();return;}
  if(a==='now'){viewDate=today0();render();return;}
  if(a==='go'){viewDate=parse(el.dataset.d);setTab('today');return;}
  if(a==='addrev'){
    const topic=window.prompt(L('topicPrompt'));
    if(topic&&topic.trim()){addReview(el.dataset.sub,topic.trim());render();toast(L('addedReview'));}
    return;
  }
  if(a==='tkdone'){const t=S.tasks.find(x=>x.id===id);if(t){t.done=!t.done;t.upd=now();save();render();}return;}
  if(a==='tkdel'){const t=S.tasks.find(x=>x.id===id);if(t){t.del=now();t.upd=now();}save();render();return;}
  if(a==='rvdone'){
    const r=S.reviews.find(x=>x.id===id);
    if(r){r.stage++;r.upd=now();if(r.stage>=INTERVALS.length){r.done=true;toast(L('allReviewsDone'));}else{r.due=iso(addDays(today0(),INTERVALS[r.stage]));}save();render();}
    return;
  }
  if(a==='rvforgot'){
    /* Step one stage back instead of starting over, so a single slip does
       not throw away weeks of spacing. */
    const r=S.reviews.find(x=>x.id===id);
    if(r){r.stage=Math.max(0,r.stage-1);r.due=iso(addDays(today0(),1));r.upd=now();save();render();toast(L('comesBack'));}
    return;
  }
  if(a==='rvdel'){const r=S.reviews.find(x=>x.id===id);if(r){r.del=now();r.upd=now();}save();render();return;}
  if(a==='pollans'){poll.draft.support=el.dataset.v==='yes';render();return;}
  if(a==='pollgrp'){poll.draft.group=parseInt(el.dataset.g,10);render();return;}
  if(a==='pollsubmit'){submitVote();return;}
  if(a==='pollchange'){const m=poll.mine;poll.editing=true;poll.draft={support:m?m.support:null,group:m?m.group:null};render();return;}
  if(a==='pollcancel'){poll.editing=false;render();return;}
  if(a==='export'){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='planner-backup.json';document.body.appendChild(l);l.click();l.remove();
    return;
  }
  if(a==='import'){$('#imp').click();return;}
  if(a==='reset'){if(window.confirm(L('confirmReset'))){replaceState(defaults());}return;}
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('input[type=checkbox][data-k]')){
    const key=t.dataset.k;
    if(t.checked){S.checks[key]=now();delete S.xchecks[key];}else{delete S.checks[key];S.xchecks[key]=now();}
    save();
    const y=window.scrollY;render();window.scrollTo(0,y);
    const n=document.querySelector('[data-k="'+CSS.escape(key)+'"]');if(n)n.focus();
    return;
  }
  if(t.id==='since'&&t.value){S.since=t.value;save();render();return;}
  if(t.id==='imp'&&t.files&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{
      try{const o=cleanBackup(JSON.parse(fr.result));replaceState(o);toast(L('backupRestored'));}
      catch(err){toast(L('badBackup'));}
      t.value='';
    };
    fr.readAsText(t.files[0]);
  }
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#auth').hidden)closeAuth();});

document.addEventListener('input',e=>{
  if(e.target.matches('textarea[data-note]')){S.notes[e.target.dataset.note]=e.target.value;S.noteAt[e.target.dataset.note]=now();save();}
});

document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const fd=new FormData(f);
  if(f.dataset.form==='auth'){
    const email=String(fd.get('email')||'').trim(),pw=String(fd.get('password')||''),name=String(fd.get('name')||'').trim();
    if(!email||!pw){setMsg(L('enterEmailPw'));return;}
    if(!bridge.emailAuth){setMsg(L('authNotReady'));return;}
    setMsg('');const btn=$('#authSubmit');if(btn)btn.disabled=true;
    Promise.resolve(bridge.emailAuth(f.dataset.m,email,pw,name)).then(()=>{const b2=$('#authSubmit');if(b2)b2.disabled=false;});
    return;
  }
  if(f.dataset.form==='task'){
    const title=(fd.get('title')||'').trim(),dl=fd.get('deadline');
    if(!title||!dl)return;
    S.tasks.push({id:newId(),title,sub:fd.get('sub'),type:fd.get('type'),deadline:dl,lead:Math.max(1,Math.min(30,parseInt(fd.get('lead'),10)||3)),done:false,upd:now()});
    save();render();toast(L('taskAdded'));
  }else if(f.dataset.form==='review'){
    const topic=(fd.get('topic')||'').trim();if(!topic)return;
    addReview(fd.get('sub'),topic);render();toast(L('addedReview'));
  }
});

applyLang();
render();renderAcct();if(!cloud.user)openAuth();
})();
</script>

<script type="module">
/* Firebase Authentication (Google, Facebook, email) + Firestore sync.
   Planner data: users/{uid}. Poll votes: support_votes/{uid}. */
const B=window.PlannerBridge;
const CFG=window.FIREBASE_CONFIG||{};
(async function(){
  if(!B||!B.cloud.configured)return;
  B.cloud.ready=true;
  let m;
  try{
    const base='https://www.gstatic.com/firebasejs/10.14.1/';
    const r=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    m={app:r[0],auth:r[1],fs:r[2]};
  }catch(e){
    console.error(e);
    B.status('offline');
    B.loadFailed('Firebase could not be loaded. Check your internet connection.');
    return;
  }
  const {initializeApp}=m.app;
  const {getAuth,onAuthStateChanged,signInWithPopup,signInWithRedirect,getRedirectResult,GoogleAuthProvider,FacebookAuthProvider,signOut,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,updateProfile}=m.auth;
  const {getFirestore,doc,getDoc,setDoc,onSnapshot,serverTimestamp,collection}=m.fs;
  const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
  try{auth.useDeviceLanguage();}catch(e){}

  const MSG={
    'auth/account-exists-with-different-credential':'This email is already registered with a different sign-in method.',
    'auth/unauthorized-domain':'This domain is not authorized in Firebase (Authentication, Settings, Authorized domains).',
    'auth/operation-not-allowed':'This sign-in method is not enabled in Firebase.',
    'auth/network-request-failed':'Could not connect to the internet.',
    'auth/web-storage-unsupported':'Your browser blocks the storage that sign-in needs.',
    'auth/invalid-api-key':'The Firebase API key is not valid.',
    'auth/operation-not-supported-in-this-environment':'Sign-in does not work when the file is opened locally. Upload it to a host that uses https.',
    'auth/invalid-credential':'The email or password is incorrect.',
    'auth/wrong-password':'The email or password is incorrect.',
    'auth/user-not-found':'The email or password is incorrect.',
    'auth/invalid-email':'That email address is not valid.',
    'auth/missing-password':'Enter your password.',
    'auth/email-already-in-use':'This email is already registered. Use the Sign in tab.',
    'auth/weak-password':'The password is too weak. Use at least 6 characters.',
    'auth/too-many-requests':'Too many attempts. Try again in a little while.',
    'auth/user-disabled':'This account has been disabled.'
  };
  function fail(e){
    console.error(e);
    B.fail(MSG[e&&e.code]||'Sign-in failed.','',e&&e.code);
  }
  const providers={
    google(){const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});return p;},
    facebook(){const p=new FacebookAuthProvider();p.addScope('email');return p;}
  };
  B.signIn=async function(kind){
    const prov=providers[kind]();
    try{await signInWithPopup(auth,prov);}
    catch(e){
      if(e.code==='auth/popup-blocked'){try{await signInWithRedirect(auth,prov);}catch(e2){fail(e2);}return;}
      if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')return;
      fail(e);
    }
  };
  B.emailAuth=async function(mode,email,pw,name){
    try{
      if(mode==='signup'){
        const c=await createUserWithEmailAndPassword(auth,email,pw);
        if(name){try{await updateProfile(c.user,{displayName:name});B.setName(name);push(false);}catch(e){console.error(e);}}
      }else{
        await signInWithEmailAndPassword(auth,email,pw);
      }
    }catch(e){fail(e);}
  };
  B.resetPassword=async function(email){
    try{await sendPasswordResetEmail(auth,email);B.notice('A password reset link was sent to your email.');}
    catch(e){fail(e);}
  };
  B.doSignOut=()=>signOut(auth).catch(fail);
  getRedirectResult(auth).catch(fail);

  /* ---- data helpers ---- */
  const norm=d=>({checks:d.checks||{},xchecks:d.xchecks||{},tasks:d.tasks||[],reviews:d.reviews||[],notes:d.notes||{},noteAt:d.noteAt||{},since:d.since||B.get().since,updatedAt:d.updatedAt||0});
  /* One merge, shared with the app, so signing in and every later update
     from another device are resolved the same way: item by item. */
  const merge=(a,b)=>B.merge(a,b);
  const DATA=['checks','xchecks','tasks','reviews','notes','noteAt','since'];
  const same=(a,b)=>DATA.every(f=>JSON.stringify(a[f])===JSON.stringify(b[f]));
  function payload(s,u){
    const pd=u.providerData&&u.providerData[0];
    return {checks:s.checks,xchecks:s.xchecks,tasks:s.tasks,reviews:s.reviews,notes:s.notes,noteAt:s.noteAt,since:s.since,updatedAt:s.updatedAt||Date.now(),
      profile:{name:u.displayName||'',email:u.email||'',photo:u.photoURL||'',provider:(pd&&pd.providerId)||''},lastSeen:serverTimestamp()};
  }

  /* ---- push (debounced) ---- */
  let timer=null;
  async function run(){
    const u=auth.currentUser;if(!u)return;
    if(navigator.onLine===false){B.status('offline');return;}
    B.status('saving');
    try{await setDoc(doc(db,'users',u.uid),payload(B.get(),u));B.status('synced');}
    catch(e){console.error(e);B.status(e&&e.code==='permission-denied'?'denied':'error');}
  }
  function push(now){clearTimeout(timer);if(now)return run();timer=setTimeout(run,900);}
  B.onSave=()=>{if(auth.currentUser){B.status('saving');push(false);}};
  B.syncNow=()=>push(true);

  /* ---- poll: one vote per account, results counted from all votes ---- */
  let pollUnsub=null;
  function pollStop(){
    if(pollUnsub){pollUnsub();pollUnsub=null;}
    B.setPoll({status:'idle',votes:[],mine:null,err:'',busy:false,editing:false});
  }
  function pollStart(user){
    if(pollUnsub){pollUnsub();pollUnsub=null;}
    B.setPoll({status:'loading',err:''});
    pollUnsub=onSnapshot(collection(db,'support_votes'),snap=>{
      const votes=snap.docs.map(d=>{const x=d.data();return {id:d.id,support:x.support===true,group:typeof x.group==='number'?x.group:null};});
      B.setPoll({status:'ready',votes,mine:votes.find(v=>v.id===user.uid)||null,err:''});
    },err=>{
      console.error(err);
      B.setPoll({status:'error',err:err&&err.code==='permission-denied'
        ?'The poll is not available yet. Publish the updated Firestore rules (see the comment at the top of index.html).'
        :'Could not load the poll. Check your connection.'});
    });
  }
  B.pollVote=async function(support,group){
    const u=auth.currentUser;
    if(!u)throw new Error('signed-out');
    await setDoc(doc(db,'support_votes',u.uid),{support:support===true,group:support===true?group:null,createdAt:serverTimestamp()});
  };

  /* ---- sign-in state ---- */
  let unsub=null,epoch=0,retry=null;
  async function attach(user,my){
    const uid=user.uid;
    B.status('syncing');
    try{
      const cache=B.read(B.keyFor(uid)),guest=B.read(B.guestKey);
      const snap=await getDoc(doc(db,'users',uid));
      if(my!==epoch)return;
      const remote=snap.exists()?norm(snap.data()):null,hasCache=B.hasData(cache);
      /* Nothing is discarded here: whatever this device did while it was
         offline is merged with whatever the account already holds. */
      let base=remote,pushIt=!remote;
      if(hasCache){base=base?merge(base,cache):cache;pushIt=true;}
      if(guest&&B.hasData(guest)){base=base?merge(base,guest):guest;pushIt=true;B.clearGuest();}
      if(!base){base=B.get();pushIt=true;}
      if(remote&&same(base,remote))pushIt=false;
      base.updatedAt=Date.now();
      B.set(base);
      if(pushIt)await push(true);else B.status('synced');
      if(my!==epoch)return;
      retry=null;
      /* An update from another device is merged into what is on screen,
         never used to replace it. If the merge adds anything the account
         does not have yet, it is sent straight back up. */
      unsub=onSnapshot(doc(db,'users',uid),s=>{
        if(!s.exists()||s.metadata.hasPendingWrites)return;
        const d=norm(s.data()),local=B.get();
        if(same(local,d)){B.status('synced');return;}
        const m=merge(local,d);
        B.set(m);
        if(same(m,d))B.status('synced');else push(true);
      },err=>{B.status(err&&err.code==='permission-denied'?'denied':'error');});
    }catch(e){
      console.error(e);
      if(e&&e.code==='permission-denied'){B.status('denied');return;}
      B.status(navigator.onLine===false?'offline':'error');
      retry=()=>attach(user,epoch);
    }
  }
  window.addEventListener('online',()=>{if(retry){const r=retry;retry=null;r();}else push(false);});
  window.addEventListener('offline',()=>{if(auth.currentUser)B.status('offline');});

  onAuthStateChanged(auth,user=>{
    const my=++epoch;
    if(unsub){unsub();unsub=null;}
    clearTimeout(timer);retry=null;
    if(!user){pollStop();B.signedOut();return;}
    const pd=user.providerData&&user.providerData[0];
    B.signedIn({uid:user.uid,name:user.displayName||'',email:user.email||'',photoURL:user.photoURL||'',provider:(pd&&pd.providerId)||''});
    attach(user,my);
    pollStart(user);
  });
})();
</script>
